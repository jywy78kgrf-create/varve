# The public witness (constitution rule 5): every push re-runs the test
# suite AND re-verifies the notebook's hash chain. A history rewrite —
# even a force-push that keeps the files plausible — goes red here for
# anyone to see.
name: verify
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -q
      - run: python -m varve verify notebook
