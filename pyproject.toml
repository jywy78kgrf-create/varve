[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varve"
version = "0.1.0"
description = "Append-only, hash-chained, auditable memory for AI agents"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
worker = ["anthropic"]

[project.scripts]
varve = "varve.__main__:main"

[tool.setuptools]
packages = ["varve"]
